name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: 📦 Publish
        run: dotnet publish src/Pocofarm -c Release -r win-x64 --self-contained -p:RestoreLockedMode=true -o artifacts/publish

      - name: 🔐 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/publish/pocofarm.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  pocofarm.exe" | Out-File -Encoding ascii artifacts/publish/pocofarm.exe.sha256

      - name: 🚀 Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" artifacts/publish/pocofarm.exe artifacts/publish/pocofarm.exe.sha256
          --title "${{ github.ref_name }}" --generate-notes
