name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish (Windows)
    # ターゲットが net10.0-windows(Windows API・WGC・ONNX Runtime)なので Windows ランナーが必須
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🏗 Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          # packages.lock.json をキーに NuGet パッケージをキャッシュする
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # ロックファイルと食い違えば失敗する(再現可能な復元)
      - name: 👨🏻‍💻 Restore dependencies
        run: dotnet restore --locked-mode

      # CI では GITHUB_ACTIONS により警告がエラー扱いになる(Directory.Build.props)
      - name: 🏗 Build
        run: dotnet build -c Release --no-restore

      - name: 🧪 Test (TRX + coverage)
        run: >
          dotnet test -c Release --no-build
          --collect "XPlat Code Coverage" --logger trx
          --results-directory artifacts/test

      - name: 📊 Coverage summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $f = Get-ChildItem artifacts/test -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $f) { "Coverage report not found." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $c = ([xml](Get-Content $f.FullName)).coverage
          "### Test coverage`n`n| Metric | Rate |`n|---|---|`n| Line | {0:P1} |`n| Branch | {1:P1} |" -f [double]$c.'line-rate', [double]$c.'branch-rate' >> $env:GITHUB_STEP_SUMMARY

      - name: 📤 Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test
          if-no-files-found: warn
          retention-days: 7

      - name: 📦 Publish (smoke check)
        run: dotnet publish src/Pocofarm -c Release -r win-x64 --self-contained -p:RestoreLockedMode=true -o artifacts/publish

      - name: 📏 Executable size
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item artifacts/publish/pocofarm.exe).Length / 1MB, 1)
          "pocofarm.exe: $mb MB" >> $env:GITHUB_STEP_SUMMARY

      - name: 📤 Upload executable
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocofarm-win-x64
          path: artifacts/publish/pocofarm.exe
          if-no-files-found: error
          retention-days: 7

  format:
    name: Format check
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: 👨🏻‍💻 Restore dependencies
        run: dotnet restore --locked-mode

      - name: 🎨 dotnet format --verify-no-changes
        run: dotnet format Pocofarm.slnx --verify-no-changes --no-restore
